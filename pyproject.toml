[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semscan"
version = "0.1.0"
description = "Multi-agent (Skills + LLM) code dataflow analysis MVP"
requires-python = ">=3.9"
dependencies = [
  "openai>=1.0.0",
]

[project.scripts]
semscan = "semscan.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]


